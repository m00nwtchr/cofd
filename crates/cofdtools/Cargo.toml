[package]
name = "cofdtools"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
web = ["dioxus/web", "dioxus/devtools"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["launch", "lib", "router"] }

directories = "*"
once_cell = "*"
futures = "*"
env_logger = "0.11"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "*"
toml = "*"

anyhow = "*"

cofd-miner.workspace = true
cofd-schema.workspace = true
tokio = { version = "1.49.0", features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
