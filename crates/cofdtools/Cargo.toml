[package]
name = "cofdtools"
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
lto = true

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { version = "0.7", features = ["router"] }

directories = "*"
once_cell = "*"
futures = "*"
env_logger = "0.11"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "*"
toml = "*"

anyhow = "*"

cofd-miner.workspace = true
cofd-schema.workspace = true
tokio = "1.49.0"
