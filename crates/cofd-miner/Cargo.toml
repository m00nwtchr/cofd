[package]
name = "cofd-miner"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A library that extracts Chronicles of Darkness game material from PDFs you own."

[features]
default = ["oxidize", "embed_meta"]
embed_meta = ["dep:serde_json", "dep:rmp-serde", "dep:cofd-meta"]

oxidize = ["dep:oxidize-pdf"]
mupdf = ["dep:mupdf"]

[dependencies]
cofd-schema = { workspace = true, features = ["json_schema"] }
cofd-meta.workspace = true

oxidize-pdf = { version = "3.1", optional = true }
mupdf = { version = "0.4", optional = true, default-features = false }

strum.workspace = true
once_cell = "1"
rayon = "1.8"

convert_case = "0.6"
highway = "1.1.0"
regex.workspace = true
itertools.workspace = true

log.workspace = true
anyhow.workspace = true
thiserror.workspace = true

serde = { workspace = true, features = ["derive"] }
rmp-serde = { workspace = true, optional = true }

[build-dependencies]
anyhow.workspace = true
serde_json = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
cofd-meta = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
walkdir = "2"
similar-asserts = { version = "1.5", features = ["serde"] }
