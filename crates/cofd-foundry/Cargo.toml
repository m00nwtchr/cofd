[package]
name = "cofd-foundry"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Foundry Virtual Tabletop system packaging the cofd rules engine with generated WebAssembly bindings"
readme = "README.md"
publish = false

[package.metadata.foundry]
id = "cofd"
title = "CofD Foundry"
description = "The CofD rules engine (cofd) packaged as WebAssembly with generated bindings for Foundry Virtual Tabletop."
url = "https://github.com/m00nwtchr/cofd"
esmodules = ["cofd.js"]
styles = ["cofd.css"]
languages = []
packs = []
media = []
readme = "README.md"
documentTypes = { Actor = { character = {} } }

[package.metadata.foundry.compatibility]
minimum = "14"
verified = "14"

[lib]
name = "cofd_foundry"
crate-type = ["cdylib", "rlib"]

[features]
default = ["uniffi"]
uniffi = ["dep:uniffi", "cofd/uniffi"]

[dependencies]
cofd.workspace = true
uniffi = { workspace = true, optional = true }
strum.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
uniffi-runtime-wasm = "0.31.0-6"
